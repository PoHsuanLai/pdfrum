# CloseTempLine (cpdf_textpage.cpp:841-866) reverses each right-to-left
# segment in place and turns one forwards only when its first character came
# from /ActualText (:851). The fixture's last line draws `בן` as literal
# glyphs and then `שלום` as /ActualText in the same segment, so the oracle
# turns the already-logical string backwards: `םולשבן`.
"resources/actual_text_rtl.in" = { why = "the oracle reverses an /ActualText string that is already in logical order because a literal right-to-left glyph opens its segment, writing `םולש` for `שלום`", cite = "[oracle-bug] core/fpdftext/cpdf_textpage.cpp:851 (pdfium a043bed4); crates/pdfrum-text/src/bidi.rs `logical_order`" }
"resources/actual_text_rtl.pdf" = { why = "the oracle reverses an /ActualText string that is already in logical order because a literal right-to-left glyph opens its segment, writing `םולש` for `שלום`", cite = "[oracle-bug] core/fpdftext/cpdf_textpage.cpp:851 (pdfium a043bed4); crates/pdfrum-text/src/bidi.rs `logical_order`" }
