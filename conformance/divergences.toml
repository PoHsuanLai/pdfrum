# Files where pdfrum deliberately disagrees with the oracle.
#
# PDFium is the oracle, not the specification. Where the two part company and
# ISO 32000-1 backs pdfrum, matching the oracle would mean reproducing a known
# defect, so the file is scored as *diverged*: it leaves the pass/fail
# denominator and is reported as its own count. It is never folded into
# `pass` — the summary always prints three numbers.
#
# The ratchet is one-directional, as in thresholds.toml. An entry is admitted
# only with evidence, and the harness enforces that: both `why` and `cite`
# must be present and non-empty, and an entry naming a file that *passes* is
# rejected, because there is nothing to excuse. Never add a row to make a
# regression green.
#
# Keyed by the corpus-relative path the scoreboard uses, `#form-events` and
# `#js-transcript` suffixes included. `why` is one sentence in the harness's
# voice; `cite` names the tracker issue, the `[oracle-bug]` source location
# that reasons it, or the upstream write-up under docs/upstream/.

[divergences]

# PDFium's text page drops any text object whose glyph bounding box measures
# empty (cpdf_textpage.cpp:881, kSizeEpsilon at :42), which costs the page its
# spaces and, on bug_921, its running prose.
"resources/whitespace.pdf" = { why = "the page's only text object draws a space, and the oracle's empty-box gate discards it, so `--txt` comes back empty where the page plainly draws one", cite = "crbug.com/40643656; crates/pdfrum-text/src/pipeline.rs `keep_spaces_only`; docs/upstream/pdfium/text-object-bbox-gate-drops-spaces.md" }
"resources/bug_921.in" = { why = "the empty-box gate drops real letters here, not whitespace, so the oracle's text dump loses running prose the page draws", cite = "crbug.com/40643656; docs/upstream/pdfium/text-object-bbox-gate-drops-spaces.md" }
"resources/bug_921.pdf" = { why = "the empty-box gate drops real letters here, not whitespace, so the oracle's text dump loses running prose the page draws", cite = "crbug.com/40643656; docs/upstream/pdfium/text-object-bbox-gate-drops-spaces.md" }
"resources/pixel/bug_665467.in" = { why = "the empty-box gate drops the page's text, which moves both the text dump and the glyphs the render puts down", cite = "crbug.com/40643656; docs/upstream/pdfium/text-object-bbox-gate-drops-spaces.md" }
"resources/pixel/bug_665467.pdf" = { why = "the empty-box gate drops the page's text, which moves both the text dump and the glyphs the render puts down", cite = "crbug.com/40643656; docs/upstream/pdfium/text-object-bbox-gate-drops-spaces.md" }

# ISO 32000-1 §11.6.6: every object in a knockout group composites against the
# group's initial backdrop, so a later object replaces an earlier one where
# they overlap. PDFium reads no `/K` under core/fpdfapi and
# `RenderDeviceDriverIface::SetGroupKnockout` is an empty body the AGG driver
# never overrides, so the oracle renders a knockout group as an ordinary one.
"resources/pixel/same_color_knockout_fill.in" = { why = "the oracle renders the knockout group as an ordinary transparency group, so its fills accumulate where §11.6.6 says the later one replaces the earlier", cite = "ISO 32000-1 §11.6.6; crates/pdfrum-render/src/walk.rs `render_knockout_form`" }
"resources/pixel/same_color_knockout_fill.pdf" = { why = "the oracle renders the knockout group as an ordinary transparency group, so its fills accumulate where §11.6.6 says the later one replaces the earlier", cite = "ISO 32000-1 §11.6.6; crates/pdfrum-render/src/walk.rs `render_knockout_form`" }

# The javascript transcripts below assert V8 itself rather than any behaviour
# ISO 32000-1 or the Acrobat scripting reference defines. pdfrum runs boa, and
# reproducing them would mean shipping V8's internals. A transcript that
# differs because pdfrum reaches the *wrong outcome* belongs in `fail`; only a
# row whose outcome already agrees and whose wording is the engine's own is
# admissible here.
"resources/javascript/foreground_task.in#js-transcript" = { why = "the fixture calls `gc`, a V8 debug builtin that is not a language feature and reaches nothing the PDF scripting model defines", cite = "crates/pdfrum-form/src/script/tests.rs `no_io_is_reachable_from_a_script`" }
"resources/javascript/v8_features.in#js-transcript" = { why = "the golden asserts `typeof gc = function`, which holds only inside V8", cite = "crates/pdfrum-form/src/script/tests.rs `no_io_is_reachable_from_a_script`" }
"resources/javascript/array_buffer.in#js-transcript" = { why = "the golden pins V8's `Array buffer allocation failed` wording for an allocation both engines refuse", cite = "ECMA-262 §25.1.3.1 (RangeError is required, its message is not)" }

# ISO 32000-1 §8.9.5.3 permits interpolation; it does not license darkening
# every reconstructed sample by two levels. The oracle's dest-space bilinear
# takes complements against 255 on a mod-256 residue, so a constant region
# comes back v-2. pdfrum's taps sum to 256 and preserve the identity.
"resources/pixel/image_transformer_other.in" = { why = "the oracle's dest-space bilinear complements against 255 on a mod-256 residue, so a constant region is two levels darker than the source the page named", cite = "docs/upstream/pdfium/image-transformer-off-by-one-complement.md" }
"resources/pixel/image_transformer_other.pdf" = { why = "the oracle's dest-space bilinear complements against 255 on a mod-256 residue, so a constant region is two levels darker than the source the page named", cite = "docs/upstream/pdfium/image-transformer-off-by-one-complement.md" }
"resources/rotated_image.in" = { why = "the same dest-space bilinear darkens a sheared image two levels, including at sample points where the filter must be an identity", cite = "docs/upstream/pdfium/image-transformer-off-by-one-complement.md" }
"resources/rotated_image.pdf" = { why = "the same dest-space bilinear darkens a sheared image two levels, including at sample points where the filter must be an identity", cite = "docs/upstream/pdfium/image-transformer-off-by-one-complement.md" }

# The text page's flow guess (cpdf_textpage.cpp:654-721) is a coverage count:
# a page whose glyphs fill no more than 0.8 of the width band (:711) and
# more of the height band is read as a column, and a one-glyph text object,
# which has no direction of its own, takes the page's. On these pages the
# glyphs step along baselines, so the guess ends a line after every glyph,
# or joins rows 45 pt apart into one. pdfrum overrules the guess only when
# one-glyph objects step along a baseline more often than down a column.
"resources/bug_1768.in" = { why = "`AAA 111` and `2 3 4` sit 45 pt apart, and the oracle's column guess joins them into one line where the page draws two rows", cite = "[oracle-bug] core/fpdftext/cpdf_textpage.cpp:711 (pdfium a043bed4); crates/pdfrum-text/src/orientation.rs `settled_flow`" }
"resources/bug_1768.pdf" = { why = "`AAA 111` and `2 3 4` sit 45 pt apart, and the oracle's column guess joins them into one line where the page draws two rows", cite = "[oracle-bug] core/fpdftext/cpdf_textpage.cpp:711 (pdfium a043bed4); crates/pdfrum-text/src/orientation.rs `settled_flow`" }
"resources/pixel/bug_846.in" = { why = "four one-glyph objects in two rows of two come back one per line, the oracle's column guess ending a line after every glyph", cite = "[oracle-bug] core/fpdftext/cpdf_textpage.cpp:711 (pdfium a043bed4); crates/pdfrum-text/src/orientation.rs `settled_flow`" }
