# pdfrum workspace — crate map in README.md; style in CONTRIBUTING.md
# closed dependency set in this file, enforced by deny.toml and the gate.

[workspace]
resolver = "2"
members = [
    "crates/pdfrum-common",
    "crates/pdfrum-object",
    "crates/pdfrum-crypt",
    "crates/pdfrum-filters",
    "crates/pdfrum-cmap",
    "crates/pdfrum-type1",
    "crates/pdfrum-font",
    "crates/pdfrum-parser",
    "crates/pdfrum-page",
    "crates/pdfrum-render",
    "crates/pdfrum-raster-vello-cpu",
    "crates/pdfrum-raster-tinyskia",
    "crates/pdfrum-raster-agg",
    # GPU backend. Never a default dep.
    "crates/pdfrum-raster-vello",
    "crates/pdfrum-text",
    "crates/pdfrum-doc",
    "crates/pdfrum-form",
    "crates/pdfrum-script",
    "crates/pdfrum-edit",
    "crates/pdfrum",
    "crates/pdfrum-tool",
    "crates/pdfrum-markdown",
    # SVG export. `resvg` is a round-trip-test dev-dependency only.
    "crates/pdfrum-svg",
    "crates/pdfrum-cli",
    # C ABI. The one member that allows `unsafe`, only at `extern "C"`.
    "crates/pdfrum-capi",
    # WebAssembly binding. Tests: wasm32-unknown-unknown under Node.
    "crates/pdfrum-wasm",
    "conformance",
    "benches",
    "benches/corpus-list",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
repository = "https://github.com/PoHsuanLai/pdfrum"

# No unsafe anywhere, no panics in library code.
# `clippy::indexing_slicing = warn` is added per-crate in parser-facing crates
# (their input is untrusted); tests may unwrap (see clippy.toml).
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
pedantic = { level = "warn", priority = -1 }
# Pedantic opt-outs (strict-and-sane): these two fight our naming and API
# conventions more than they help; everything else in pedantic stays on.
module_name_repetitions = "allow"
must_use_candidate = "allow"

# Every lib dependency is declared here with an exact pin. Member crates
# inherit an entry only when they actually use it.
[workspace.dependencies]
# internal
pdfrum-common = { path = "crates/pdfrum-common", version = "=0.1.0" }
pdfrum-object = { path = "crates/pdfrum-object", version = "=0.1.0" }
pdfrum-crypt = { path = "crates/pdfrum-crypt", version = "=0.1.0" }
pdfrum-filters = { path = "crates/pdfrum-filters", version = "=0.1.0" }
pdfrum-cmap = { path = "crates/pdfrum-cmap", version = "=0.1.0" }
pdfrum-type1 = { path = "crates/pdfrum-type1", version = "=0.1.0" }
pdfrum-font = { path = "crates/pdfrum-font", version = "=0.1.0" }
pdfrum-parser = { path = "crates/pdfrum-parser", version = "=0.1.0" }
pdfrum-page = { path = "crates/pdfrum-page", version = "=0.1.0" }
pdfrum-render = { path = "crates/pdfrum-render", version = "=0.1.0" }
pdfrum-raster-vello-cpu = { path = "crates/pdfrum-raster-vello-cpu", version = "=0.1.0" }
pdfrum-raster-agg = { path = "crates/pdfrum-raster-agg", version = "=0.1.0" }
pdfrum-raster-tinyskia = { path = "crates/pdfrum-raster-tinyskia", version = "=0.1.0" }
# GPU backend. Not a dependency of the facade or the tool: reachable only
# by naming it, which keeps a headless build free of `wgpu`.
pdfrum-raster-vello = { path = "crates/pdfrum-raster-vello", version = "=0.1.0" }
pdfrum-text = { path = "crates/pdfrum-text", version = "=0.1.0" }
pdfrum-doc = { path = "crates/pdfrum-doc", version = "=0.1.0" }
pdfrum-form = { path = "crates/pdfrum-form", version = "=0.1.0" }
pdfrum-script = { path = "crates/pdfrum-script", version = "=0.1.0" }
pdfrum-edit = { path = "crates/pdfrum-edit", version = "=0.1.0" }
pdfrum = { path = "crates/pdfrum", version = "=0.1.0" }
pdfrum-markdown = { path = "crates/pdfrum-markdown", version = "=0.1.0" }
pdfrum-svg = { path = "crates/pdfrum-svg", version = "=0.1.0" }
# Bench corpus list. A leaf so library crates can share it without depending
# on the facade. `publish = false`.
pdfrum-corpus = { path = "benches/corpus-list" }

# rendering & geometry
kurbo = "=0.13.1"
peniko = "=0.6.1"
vello_cpu = { version = "=0.2.0", default-features = false, features = ["std", "f32_pipeline"] }
tiny-skia = "=0.12.0"
# GPU vello, used only by `pdfrum-raster-vello`. Default features stay on
# vello's `wgpu`/`wgpu_default` pair is what provides `Renderer`.
#
# Pin is 0.10.0 / wgpu 29. Device injection typechecks against the wgpu a
# `Renderer` was built with, so the backend re-exports vello's own `wgpu`.
vello = "=0.10.0"

# fonts
skrifa = "=0.46.2"
read-fonts = "=0.43.3"
fontdb = { version = "=0.24.0", default-features = false }
# `variable-fonts` (on by default) pulls a second skrifa/write-fonts/kurbo and
# buys only CFF2 + variation instancing. Off keeps the tree to one skrifa.
subsetter = { version = "=0.2.6", default-features = false }

# codecs & color
# 0.9, matching `flate2` (which png 0.18 also pulls). png itself still
# depends on miniz_oxide 0.8 as well; that extra copy is png's, not ours.
miniz_oxide = "=0.9.1"
# 0.1, not 0.2: gif 0.14 (resvg's `raster-images`) requires weezl 0.1.
# The TIFF/MSB `Configuration` API LZW uses is in both; staying on 0.1
# keeps one copy in the lockfile.
weezl = "=0.1.12"
zune-jpeg = "=0.5.15"
# `image` (on by default) is the `image` crate integration plus a second
# moxcms 0.8. We decode with `Image::new` and convert colour ourselves.
hayro-jpeg2000 = { version = "=0.4.0", default-features = false, features = ["std", "simd"] }
# `image` (on by default) is only the `image` crate encoder the crate's
# example uses. We consume `Image::new_embedded`.
hayro-jbig2 = { version = "=0.3.0", default-features = false, features = ["std", "simd"] }
hayro-ccitt = "=0.3.0"
moxcms = "=0.9.0"

# crypto, text, numeric
aes = "=0.9.3"
cbc = "=0.2.1"
cipher = "=0.5.2"
# OS entropy for file keys and AES vectors. Pure Rust: on each platform a
# direct syscall (`getrandom(2)`, `arc4random_buf`, `RtlGenRandom`), no C
# shim and no build script.
getrandom = "=0.4.3"
md-5 = "=0.11.0"
sha1 = "=0.11.0"
sha2 = "=0.11.0"
unicode-bidi = "=0.3.18"
# RFC 4013 SASLprep needs NFKC for revision-6 password preparation
# (ISO 32000-2 §7.6.4.3.3). Pure Rust, one transitive dep (`tinyvec`).
unicode-normalization = "=0.1.25"
ryu = "=1.0.23"
smallvec = "=1.16.0"
# Shared byte buffers. Owner and data pointer are decoupled, so a `Vec` can be
# adopted without copying it — see `pdfrum_object::ByteSpan`. Zero transitive
# dependencies, MIT, pure Rust.
bytes = "=1.12.1"
thiserror = "=2.0.20"
rayon = "=1.12.0"

# JavaScript engine. Reachable only through `pdfrum-form`'s default-off
# `javascript` feature.
#
# `default-features = false` is load-bearing: `temporal` pulls an ICU tree
# for a `Temporal` API no PDF script uses.
boa_engine = { version = "=0.22.0", default-features = false }

# tools & tests only: never in a library crate.
anyhow = "=1.0.104"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
clap = { version = "=4.6.6", features = ["derive", "env"] }
# `completions` and `manpage`: clap's own generators.
clap_complete = "=4.6.9"
clap_mangen = "=0.3.3"
# Terminal: keys, size and screen for the CLI's `view`, and a silent password
# prompt. Inline pictures (kitty, iTerm2, half-block) are written by hand:
# `viuer` would have done it, but its half-block path pulls `ansi_colours`,
# LGPL-3.0, which this tree's licence allowlist refuses.
crossterm = { version = "=0.29.0", default-features = false, features = ["events", "windows"] }
rpassword = "=7.5.4"
png = "=0.18.1"
# SVG round-trip: `pdfrum-svg`'s SVG rendered by a second engine and scored
# against the oracle PNG. Dev-dependency of `pdfrum-svg` only.
#
# Defaults dropped (`text`, `system-fonts`, `memmap-fonts`) because every
# glyph is already a filled outline. `raster-images` kept for `<image>`.
resvg = { version = "=0.48.1", default-features = false, features = ["raster-images"] }
# SVG ingestion: the resolved tree `Canvas::draw_svg` compiles into page
# operators. Default-off behind `pdfrum/svg-import`.
#
# Defaults dropped so SVG text maps through `pdfrum-font`, not a second font
# stack. Without `text`, `usvg` drops `<text>` from the tree.
usvg = { version = "=0.48.1", default-features = false }
# Criterion, for the five per-crate bench targets and `pdfrum-bench`. Declared
# here rather than repeated in six manifests so the pin and its reason live in
# one place.
#
# Pinned to 0.5, not the current 0.8: since 0.6 criterion depends
# unconditionally on `alloca`, which has a `cc` build-dependency and compiles
# C. the pure-Rust guarantee is enforced by `cargo-deny`, which bans `cc`
# outright, and `scripts/ci.nu` walks the whole workspace — so 0.8 fails the
# gate. There is no feature flag that avoids it (`alloca` is not optional). 0.5
# predates that dependency and is pure Rust; nothing in any bench uses an API
# newer than it. It appears in no library crate's normal dependency tree.
criterion = { version = "=0.5.1", default-features = false, features = ["cargo_bench_support"] }

# Line tables so `scripts/profile.nu` names functions. `debug = 1` is
# line-tables-plus-frame-info, not full DWARF locals.
[profile.release]
debug = 1

# Profile `crates/pdfrum-wasm` is built under. Cargo ignores `[profile.*]` in
# a workspace member, so it lives here. Size is a trade only the web binding
# wants.
[profile.wasm]
inherits = "release"
# Speed, which on this crate is also the smallest. Measured on the shipped
# `_bg.wasm` after `wasm-opt -Oz`
#
# opt-level raw after bindgen after wasm-opt -Oz
# 3 5,650,552 5,097,256 4,827,012
# "s" 5,959,819 5,368,249 4,932,482
# "z" 6,040,761 5,409,739 4,982,040
#
# `3` wins at every stage. The crate is a rasterizer and three image codecs
# `z` refuses to unroll those loops.
opt-level = 3
# One codegen unit lets LLVM see the whole module.
codegen-units = 1
# Cross-crate inlining and dead-code elimination: the single largest win.
lto = true
# `wasm32-unknown-unknown` has no unwinder, so a panic aborts either way.
# Saying so drops the landing pads.
panic = "abort"
# No DWARF in a module a browser downloads; `release` above sets `debug = 1`.
debug = false
strip = true
