# pdfrum workspace — see PLAN.md §3 for the crate architecture,
# STYLE.md for the binding style rules, DEPS.md for the closed dependency set.

[workspace]
resolver = "2"
members = [
    "crates/pdfrum-common",
    "crates/pdfrum-object",
    "crates/pdfrum-crypt",
    "crates/pdfrum-filters",
    "crates/pdfrum-cmap",
    "crates/pdfrum-type1",
    "crates/pdfrum-font",
    "crates/pdfrum-parser",
    "crates/pdfrum-page",
    "crates/pdfrum-render",
    "crates/pdfrum-raster-vello-cpu",
    "crates/pdfrum-raster-tinyskia",
    "crates/pdfrum-raster-agg",
    # M12c. A workspace member so it is built, tested and linted like anything
    # else — but nothing in the core ring depends on it, and
    # `scripts/check-no-wgpu.nu` asserts that the facade's default tree still
    # resolves without `wgpu`.
    "crates/pdfrum-raster-vello",
    "crates/pdfrum-text",
    "crates/pdfrum-doc",
    "crates/pdfrum-form",
    "crates/pdfrum-script",
    "crates/pdfrum-edit",
    "crates/pdfrum",
    "crates/pdfrum-tool",
    "crates/pdfrum-markdown",
    "crates/pdfrum-cli",
    # M22 phase 2. The C ABI: `libpdfrum.so`, `libpdfrum.a` and `pdfrum.h`.
    # The one member that overrides the workspace's `unsafe_code = "forbid"`,
    # under the rule in docs/design/capi.md — unsafe only in the `extern "C"`
    # boundary, every one with a `# Safety` section, nothing unsafe below the
    # facade. It adds no external dependency: `pdfrum` is all it needs.
    "crates/pdfrum-capi",
    # M22 phase 4. The WebAssembly binding: the same handles as the C ABI in
    # JavaScript shape, plus the TypeScript types wasm-bindgen generates from
    # the same source. A member so it is formatted, linted and documented like
    # anything else; its own tests run on `wasm32-unknown-unknown` under Node,
    # which `scripts/ci.nu` runs as its own stage and skips with a note when
    # the target or `node` is absent.
    "crates/pdfrum-wasm",
    "conformance",
    "benches",
    "benches/corpus-list",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/PoHsuanLai/pdfrum"

# STYLE.md §3: no unsafe anywhere, no panics in library code.
# `clippy::indexing_slicing = warn` is added per-crate in parser-facing crates
# (their input is untrusted); tests may unwrap (see clippy.toml).
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
pedantic = { level = "warn", priority = -1 }
# Pedantic opt-outs (strict-and-sane): these two fight our naming and API
# conventions more than they help; everything else in pedantic stays on.
module_name_repetitions = "allow"
must_use_candidate = "allow"

# DEPS.md is the closed manifest; every lib dependency is declared here with an
# exact pin (versions verified against crates.io 2026-08-29). Member crates
# inherit an entry only when they actually use it.
[workspace.dependencies]
# internal
pdfrum-common = { path = "crates/pdfrum-common", version = "=0.1.0" }
pdfrum-object = { path = "crates/pdfrum-object", version = "=0.1.0" }
pdfrum-crypt = { path = "crates/pdfrum-crypt", version = "=0.1.0" }
pdfrum-filters = { path = "crates/pdfrum-filters", version = "=0.1.0" }
pdfrum-cmap = { path = "crates/pdfrum-cmap", version = "=0.1.0" }
pdfrum-type1 = { path = "crates/pdfrum-type1", version = "=0.1.0" }
pdfrum-font = { path = "crates/pdfrum-font", version = "=0.1.0" }
pdfrum-parser = { path = "crates/pdfrum-parser", version = "=0.1.0" }
pdfrum-page = { path = "crates/pdfrum-page", version = "=0.1.0" }
pdfrum-render = { path = "crates/pdfrum-render", version = "=0.1.0" }
pdfrum-raster-vello-cpu = { path = "crates/pdfrum-raster-vello-cpu", version = "=0.1.0" }
pdfrum-raster-agg = { path = "crates/pdfrum-raster-agg", version = "=0.1.0" }
pdfrum-raster-tinyskia = { path = "crates/pdfrum-raster-tinyskia", version = "=0.1.0" }
# M12c's GPU backend. Deliberately **not** a dependency of the facade or the
# tool: it is reachable by naming it, which is what keeps a headless build's
# tree free of `wgpu` (DEPS.md's exemption and its blast radius).
pdfrum-raster-vello = { path = "crates/pdfrum-raster-vello", version = "=0.1.0" }
pdfrum-text = { path = "crates/pdfrum-text", version = "=0.1.0" }
pdfrum-doc = { path = "crates/pdfrum-doc", version = "=0.1.0" }
pdfrum-form = { path = "crates/pdfrum-form", version = "=0.1.0" }
pdfrum-script = { path = "crates/pdfrum-script", version = "=0.1.0" }
pdfrum-edit = { path = "crates/pdfrum-edit", version = "=0.1.0" }
pdfrum = { path = "crates/pdfrum", version = "=0.1.0" }
pdfrum-markdown = { path = "crates/pdfrum-markdown", version = "=0.1.0" }
# The M12 bench corpus list. A leaf — it depends on nothing, which is what lets
# five library crates dev-depend on it without any of them acquiring a
# dependency on the facade that depends on them. `publish = false`.
pdfrum-corpus = { path = "benches/corpus-list", version = "=0.1.0" }

# rendering & geometry
kurbo = "=0.13.1"
peniko = "=0.6.1"
vello_cpu = { version = "=0.2.0", default-features = false, features = ["std", "f32_pipeline"] }
tiny-skia = "=0.12.0"
# M12c: GPU vello, used by exactly one crate (`pdfrum-raster-vello`) that
# nothing in the core ring depends on. `default-features` are left ON because
# vello's `wgpu`/`wgpu_default` pair is what provides `Renderer` at all —
# without them the crate is an encoder with no way to rasterize.
#
# The version is 0.10.0 and it resolves **wgpu 29**, not the wgpu 30 PLAN.md
# §M12c predicted. That matters beyond a pin: device
# injection only typechecks against the exact wgpu a `Renderer` was built
# with, so the backend re-exports vello's own `wgpu` and an embedder must hand
# it a device from *that* one. There is no vello release against wgpu 30
# today; when there is, this pin is the only line that changes.
vello = "=0.10.0"

# fonts
skrifa = "=0.46.2"
read-fonts = "=0.43.3"
fontdb = { version = "=0.24.0", default-features = false }
# `variable-fonts` (on by default) pulls a second skrifa/write-fonts/kurbo and
# buys only CFF2 + variation instancing, neither of which the C++ subsetter
# does either (edit brief E4). Off keeps the tree to one skrifa.
subsetter = { version = "=0.2.6", default-features = false }

# codecs & color
miniz_oxide = "=0.9.1"
weezl = "=0.2.1"
zune-jpeg = "=0.5.15"
hayro-jpeg2000 = "=0.4.0"
hayro-jbig2 = "=0.3.0"
hayro-ccitt = "=0.3.0"
moxcms = "=0.9.0"

# crypto, text, numeric
aes = "=0.9.3"
cbc = "=0.2.1"
cipher = "=0.5.2"
md-5 = "=0.11.0"
sha1 = "=0.11.0"
sha2 = "=0.11.0"
unicode-bidi = "=0.3.18"
# A31: RFC 4013 SASLprep needs NFKC for the revision-6 password preparation
# (ISO 32000-2 §7.6.4.3.3). Pure Rust, one transitive dep (`tinyvec`).
unicode-normalization = "=0.1.25"
ryu = "=1.0.23"
smallvec = "=1.15.2"
thiserror = "=2.0.20"
rayon = "=1.12.0"

# JavaScript engine — M15. Reachable ONLY through `pdfrum-form`'s default-off
# `script` feature, which `scripts/check-no-boa.nu` asserts mechanically in
# both directions (absent by default; present with the feature, so the first
# check cannot pass vacuously).
#
# `default-features = false` is load-bearing, not tidiness: the three defaults
# are `float16`, `xsum` and `temporal`, and `temporal` alone drags
# `icu_calendar`, `temporal_rs` and `timezone_provider` — an ICU tree for a
# `Temporal` API no PDF script has ever called. See DEPS.md for the measured
# admission (132 crates, zero `-sys`, zero `cc`, `cargo deny` clean).
boa_engine = { version = "=0.22.0", default-features = false }

# tools & tests only (DEPS.md "Tools & tests only"): never in a library crate.
anyhow = "=1.0.104"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
clap = { version = "=4.6.6", features = ["derive", "env"] }
png = "=0.18.1"
# Criterion, for the five per-crate bench targets and `pdfrum-bench`. Declared
# here rather than repeated in six manifests so the pin and its reason live in
# one place.
#
# Pinned to 0.5, not the current 0.8: since 0.6 criterion depends
# unconditionally on `alloca`, which has a `cc` build-dependency and compiles
# C. DEPS.md's pure-Rust guarantee is enforced by `cargo-deny`, which bans `cc`
# outright, and `scripts/ci.nu` walks the whole workspace — so 0.8 fails the
# gate. There is no feature flag that avoids it (`alloca` is not optional). 0.5
# predates that dependency and is pure Rust; nothing in any bench uses an API
# newer than it. It appears in no library crate's normal dependency tree.
criterion = { version = "=0.5.1", default-features = false, features = ["cargo_bench_support"] }

# M12: a release build carries line tables so `scripts/profile.nu` names
# functions instead of addresses. `debug = 1` is line-tables-plus-frame-info,
# not full DWARF locals — it changes no code the optimizer emits, costs only
# binary size and link time, and without it every profile in the internal working notes
# would have had to be taken against a separate build that is not the one
# `cargo bench` measures. Benchmarks and profiles now describe the same binary.
[profile.release]
debug = 1

# M22 phase 4. The profile `crates/pdfrum-wasm` is built under, named rather
# than folded into `release` for two reasons: cargo ignores a `[profile.*]`
# table in a workspace *member*, so it had to live here; and size is a trade
# only the web binding wants — `opt-level = "z"` and `lto` cost native build
# time and native speed that nothing else in this workspace is asking to
# spend. `wasm-pack build --profile wasm` and `cargo build --profile wasm`
# both take it. The measurement behind the settings is in the internal working notes.
[profile.wasm]
inherits = "release"
# Optimize for speed, which on this crate is *also* the smallest. Measured on
# the shipped module — the `_bg.wasm` wasm-bindgen emits, after `wasm-opt -Oz`:
#
#   opt-level      raw        after bindgen   after wasm-opt -Oz
#   3            5,650,552      5,097,256          4,827,012
#   "s"          5,959,819      5,368,249          4,932,482
#   "z"          6,040,761      5,409,739          4,982,040
#
# `3` wins at every stage, by 3% over `"z"` on the shipped artefact. That is
# the opposite of the usual advice, and it was measured rather than assumed:
# this crate's bulk is a rasterizer and three image codecs, whose inner loops
# `z` refuses to unroll or vectorize and then pays for in call overhead and
# spill code. No tie-break on render time was needed — `3` is both the
# smallest and the fastest here.
opt-level = 3
# One codegen unit lets LLVM see the whole module.
codegen-units = 1
# Cross-crate inlining and dead-code elimination: the single largest win.
lto = true
# `wasm32-unknown-unknown` has no unwinder, so a panic aborts either way.
# Saying so drops the landing pads.
panic = "abort"
# No DWARF in a module a browser downloads; `release` above sets `debug = 1`.
debug = false
strip = true
