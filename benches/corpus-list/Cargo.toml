[package]
name = "pdfrum-corpus"
description = "The benchmark corpus: which documents, and what class each is in"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# A leaf: no pdfrum dependency, no criterion. Five library crates share this
# list so `cargo bench -p pdfrum-parser` does not build the rasterizer.
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[dependencies]
