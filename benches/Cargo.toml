[package]
name = "pdfrum-bench"
description = "Ratchet, profile and scaling binaries; corpus for the per-crate benches"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Harness, not library: a missing fixture should stop, not measure nothing.
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

# Off by default: cargo unifies features, so a default-on here would put
# the instrument inside every criterion group. `scripts/profile.nu --walk`
# turns it on for this binary only.
[features]
default = []
profiling = ["pdfrum-render/profiling", "pdfrum/profiling"]

[dependencies]
pdfrum.workspace = true
pdfrum-corpus.workspace = true
# Profile clocks the rasterizer seam; the facade does not re-export it.
pdfrum-render.workspace = true
pdfrum-page.workspace = true
pdfrum-raster-agg.workspace = true
pdfrum-raster-tinyskia.workspace = true
pdfrum-raster-vello-cpu.workspace = true
pdfrum-common.workspace = true
kurbo.workspace = true
rayon.workspace = true
peniko.workspace = true
# No `[[bench]]`. Groups live with the crate they measure. See `README.md`.
