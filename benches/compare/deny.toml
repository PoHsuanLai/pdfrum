# cargo-deny for the M21 comparison workspace — the ROOT deny.toml's policy,
# plus the exceptions this workspace exists to measure. The root workspace's
# `cargo deny check` never sees this tree (benches/compare is its own
# workspace, like fuzz/), so this file is what `cargo deny check` reads when
# run with `--manifest-path benches/compare/Cargo.toml`. Every entry below
# that is not in the root file is BENCHMARK-ONLY: it admits a peer engine
# into the comparison, never into a published crate's tree.

[graph]
all-features = true
# One target: the comparison runs here and nowhere else, and the
# every-target graph drags `r-efi` (LGPL-2.1-or-later, via getrandom's UEFI
# branch) into a tree no build of this crate resolves.
targets = ["x86_64-unknown-linux-gnu"]

[licenses]
allow = [
    # The root allowlist, verbatim.
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "Zlib",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "ISC",
    # Benchmark-only, from here down.
    #   AGPL-3.0: `mupdf` and `mupdf-sys` — MuPDF's own licence, which is
    #   why MuPDF is a *baseline* in these tables and could never be a
    #   dependency of pdfrum. Nothing published links it.
    "AGPL-3.0",
    #   BSL-1.0 / Unlicense / 0BSD: `ryu`, `memchr`/`byteorder`/`jiff`,
    #   `adler2` — every one of them dual-licensed with MIT or Apache-2.0,
    #   so the root tree resolves them to an allowed branch. Listed here only
    #   because `all-features = true` widens the graph and cargo-deny then
    #   reports the branch it picked.
    "BSL-1.0",
    "Unlicense",
    "0BSD",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "allow"
# The root file bans `cc`, `cmake`, `bindgen` and `pkg-config` outright:
# that is the pure-Rust guarantee, and it holds for every published crate.
# This workspace measures two engines that compile C, so the ban cannot
# apply here — `mupdf-sys` runs `bindgen` and `cc` over the vendored MuPDF,
# and `pdfium-render` binds `libpdfium.so` through `libloading`. The
# guarantee is enforced where it matters: `scripts/ci.nu` walks the ROOT
# workspace, which this crate is not a member of.
deny = []

[advisories]
yanked = "warn"
# Benchmark-only. `ttf-parser` 0.25 (RUSTSEC-2026-0192, unmaintained since
# its author moved to `skrifa`) is reached through two PEERS and nothing of
# ours: pdf_oxide -> fontdb 0.23 -> ttf-parser, and pdf-extract -> lopdf 0.42
# -> ttf-parser. pdfrum's own tree is on `skrifa`, the crate the advisory
# recommends. Ignored here so the peers can be measured as published; the
# root workspace's audit is untouched.
ignore = ["RUSTSEC-2026-0192"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
