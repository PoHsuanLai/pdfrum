# Demo terminal for ./scripts/record-cli.nu. Not a product theme file.

font_family DejaVu Sans Mono
font_size 13
remember_window_size no
initial_window_width 960
initial_window_height 1280
hide_window_decorations yes
linux_display_server x11
allow_remote_control yes
shell_integration disabled
cursor_blink_interval 0
enable_audio_bell no
confirm_os_window_close 0

background #0d0e10
foreground #f2f0ea
cursor #f06a9b
selection_background #3a2a32

color0 #1c1d21
color1 #e01b24
color2 #7aab7d
color3 #d4b483
color4 #6b8ca8
color5 #f06a9b
color6 #8ec8c8
color7 #f2f0ea
color8 #6b6762
color9 #e01b24
color10 #8fbf91
color11 #e0c07a
