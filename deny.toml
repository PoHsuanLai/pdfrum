# cargo-deny: license allow-list and the pure-Rust ban.
# `scripts/ci.nu` also rejects `*-sys` crates via `cargo tree`.

[graph]
all-features = false

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "Zlib",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    # GPU tree only (`pdfrum-raster-vello`)
    # CC0-1.0: hexf-parse <- naga <- wgpu-core
    # ISC: libloading <- ash <- gpu-allocator <- wgpu-hal
    "CC0-1.0",
    "ISC",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
# No C/C++ build machinery in the workspace graph.
deny = [
    # `minicov` is wasm-bindgen-test's coverage helper. Reachable only as a
    # build-dep through pdfrum-wasm's **dev** tree; never in anything that ships.
    { crate = "cc", wrappers = ["minicov"], reason = "pure-Rust: no C compiled into any build; minicov is wasm-bindgen-test's coverage helper, dev-only" },
    { crate = "cmake", reason = "pure-Rust: no native build systems" },
    { crate = "bindgen", reason = "pure-Rust: no C bindings" },
    # Both wrappers disable the probe: wayland-sys `dlopen`, khronos-egl `dynamic`.
    { crate = "pkg-config", wrappers = ["wayland-sys", "khronos-egl"], reason = "pure-Rust: no external C library linkage; both wrappers disable the pkg-config probe" },
]

[advisories]
# Most dependencies are an exact pin, so a yank is not routed around by
# resolution — it is a decision to make, not a warning to scroll past.
# `kurbo` and `peniko` are the exception (caret): their types are public.
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
