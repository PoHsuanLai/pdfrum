# unwrap/expect/panic are denied workspace-wide (STYLE.md §3) for library
# code; tests may use them.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true

# Proper nouns that doc comments may use without backticks (".." keeps the
# clippy defaults).
doc-valid-idents = [
    "PDFium",
    "FreeType",
    "PostScript",
    "AcroForm",
    "ToUnicode",
    "RunLength",
    "CMap",
    "CMaps",
    "RustCrypto",
    "..",
]
