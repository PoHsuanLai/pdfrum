# unwrap/expect/panic are denied workspace-wide for library
# code; tests may use them.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true

# Proper nouns that doc comments may use without backticks (".." keeps the
# clippy defaults).
doc-valid-idents = [
    "PDFium",
    "FreeType",
    "PostScript",
    "AcroForm",
    "ToUnicode",
    "RunLength",
    "CommonMark",
    "CMap",
    "CMaps",
    "RustCrypto",
    "CourierStd",
    "ZapfDingbats",
    "MacRoman",
    "MacExpert",
    "WinAnsi",
    "OpenType",
    "TrueType",
    "MMType1",
    "PDFDoc",
    "BoldOblique",
    "GlyphName",
    "MyriadPro",
    "SimSun",
    "KaiTi",
    "HeiTi",
    "FangSong",
    "XinSong",
    "..",
]
