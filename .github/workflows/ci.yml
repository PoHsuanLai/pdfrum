# The part of the gate a stock runner can run.
#
# `scripts/ci.nu` is the definition of done and it is wider than this file. Two
# of its steps need things a hosted runner does not have and this workflow does
# not attempt:
#
#   - The conformance board. Every tier of it is measured against a read-only
#     PDFium checkout and a built `pdfium_test` binary, which is a multi-hour
#     Chromium-style build. It stays local, and it is what a maintainer runs
#     before landing a change that could move pixels or text.
#   - The performance ratchet. `benches/baseline.json` holds medians taken on
#     one reference machine; a shared runner's numbers mean nothing against
#     them.
#
# Everything else runs here, including the C ABI test and the WebAssembly
# tests, because their tools install in seconds. A contributor without those
# tools still gets the rest of the gate locally — `scripts/ci.nu` prints a note
# and continues, and this workflow installs them so the note never fires.

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: fmt, clippy, tests, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup toolchain install nightly --profile minimal
          rustup target add wasm32-unknown-unknown
          rustup default stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # The gate's tools, fetched as binaries rather than built from source.
      # `rust-cache` above does not help here: it caches build artifacts, not
      # `~/.cargo/bin`, so every `cargo install` paid a full compile on every
      # run. Three tiers, because no single mechanism covers the set:
      #
      #   1. `install-action` knows the tool and fetches from its releases.
      #   2. It does not, but the project publishes Linux binaries, so
      #      `binstall` finds them. `binstall` itself comes from tier 1, which
      #      is what keeps this from bootstrapping with a compile.
      #   3. The project publishes no binary at all and source is the only
      #      option. `cargo-public-api` and `cbindgen` ship none as of
      #      2026-09-07; check again before assuming they still do not.
      #
      # Actions are pinned by commit SHA, not tag: a tag is mutable and these
      # run with a token that can read the repository.
      - name: Install the prebuilt tools
        uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6 # v2
        with:
          # `wasm-bindgen` must match the `wasm-bindgen` crate version in
          # `crates/pdfrum-wasm/Cargo.toml`; a mismatch is a runtime error.
          # Keep the two in step.
          tool: cargo-nextest,cargo-deny,wasm-bindgen@0.2.128,cargo-binstall

      - name: Install nushell
        # The scripts are nushell. `install-action` does not carry it, but
        # nushell publishes x86-64 Linux binaries and `binstall` takes them.
        run: cargo binstall --no-confirm --locked nu

      - name: Install the tools that publish no binary
        # Source builds, because there is nothing to fetch. `--locked` so a
        # transitive bump cannot break the run on a day nothing here changed.
        run: |
          cargo install cargo-public-api --locked
          cargo install cbindgen --locked

      - name: The gate
        # Runs fmt, clippy, pdfrum feature combinations, nextest, doctests,
        # rustdoc, the public-API snapshot, cargo-deny, the pure-Rust
        # dependency-tree check, the C header and C test, the WebAssembly
        # tests, and a cargo check of the fuzz workspace.
        run: ./scripts/ci.nu

  # The gate above is Linux-only in several of its steps — the C test, the
  # WebAssembly run, cbindgen — and running the whole nushell script three
  # times would mostly re-run what Linux already covered. This is the part
  # that is actually operating-system-shaped: `pdfrum-cli` turns on
  # crossterm's `windows` feature and `system-fonts` reaches for `fontdb`,
  # and neither of those compiles the same way twice. Build, test, doctest.
  portable:
    name: build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing is a fact worth having about the other two.
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install the prebuilt tools
        uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6 # v2
        with:
          tool: cargo-nextest

      - name: Build
        run: cargo build --workspace --locked

      - name: Tests
        # The same feature set the Linux gate runs, minus `pdfrum-tool`: it is
        # `publish = false` and its javascript feature adds nothing this is
        # here to learn about the platform.
        run: cargo nextest run --workspace --locked --features pdfrum-cli/javascript,pdfrum/svg

      - name: Doctests
        # nextest skips doctests without saying so.
        run: cargo test --doc --workspace --locked --features pdfrum/svg

  # The floor the manifests promise. Nothing else pins it, so a dependency
  # that quietly needs a newer compiler would otherwise be found by whoever
  # tried to build on the version `rust-version` advertises.
  #
  # `--lib` because some test targets want features the libraries do not, and
  # it is the libraries that carry the promise.
  msrv:
    name: minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the toolchain
        # Read from the workspace manifest so this job and the promise cannot
        # drift apart.
        run: |
          msrv="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(next(p["rust_version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "pdfrum"))')"
          echo "pinning rustc $msrv"
          rustup toolchain install "$msrv" --profile minimal
          rustup default "$msrv"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Check
        run: cargo check --workspace --lib --locked
