# Publishing the workspace to crates.io, on a version tag.
#
# `scripts/release.nu` is the whole of the upload; this file is the trigger,
# the toolchain and the token. Twenty-three crates go up in dependency order,
# and because crates.io accepts a version once and never again, the script
# skips a crate whose version is already there rather than failing. A run
# interrupted halfway is finished by re-running it.
#
# A tag pushed by hand is one trigger. `tag-release.yml` is the other: it
# tags main after a cut changelog and calls this file (`workflow_call`)
# because a GITHUB_TOKEN tag push would not start a second workflow. After a
# successful publish it opens the GitHub Release from the changelog section.
#
# `cargo publish` does the uploading, one crate at a time, with verification
# left on: it builds each packaged crate against the versions it will resolve
# to on the index, which is the only check that the manifest cargo uploads —
# not the one in this repository — is coherent. A release tool that batches
# the workspace would hide exactly that.
#
# The dry run packages every crate with its unpublished siblings visible and
# uploads nothing, which is the one way to exercise this without spending a
# version number. It runs on *every* path, the real release included: a tag
# push sets no `inputs`, so gating it on `inputs.dry-run` used to skip the
# packaging check on the one run where a bad manifest cannot be taken back.
#
# Publishing is also gated on CI having passed for the tagged commit. Twenty-
# three write-once uploads is not something to start from a red tree.

name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Package and verify every crate, but upload nothing.
        type: boolean
        default: true
  workflow_call:

env:
  CARGO_TERM_COLOR: always

# The publish step gets its registry token from `secrets`. `contents: write`
# is the GitHub Release after a successful upload, not a commit. `actions:
# read` is for the CI-status gate below.
permissions:
  contents: write
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: publish to crates.io
    runs-on: ubuntu-latest
    # `cargo publish` waits on the index between crates. A first release of 23
    # new crate names also drains crates.io's new-crate leaky bucket (burst of
    # 5, then one every 10 minutes), which is a few hours; later version bumps
    # fit in the 30-crate version burst. The job is resumable if this fires.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the toolchain
        run: rustup toolchain install 1.98.1 --profile minimal && rustup default 1.98.1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install the prebuilt tools
        uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6 # v2
        with:
          tool: cargo-binstall

      - name: Install nushell
        # Pin the minor: this is the workflow that uploads write-once crates.
        run: cargo binstall --no-confirm --locked nu@0.110.0

      # A tag that does not name the version in `Cargo.toml` would publish
      # something other than what it claims, and the version it publishes is
      # the one nobody can take back.
      - name: The tag matches the workspace version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "pdfrum"))')"
          if [ "$tagged" != "$declared" ]; then
            echo "tag $GITHUB_REF_NAME declares $tagged, Cargo.toml declares $declared" >&2
            exit 1
          fi

      # An upload cannot be withdrawn, so a real release only starts from a
      # commit CI has already passed. A tag push carries no `inputs`, so this
      # cannot be expressed as a dry-run condition; it asks GitHub directly.
      - name: CI passed for this commit
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          conclusion="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&status=completed" \
            --jq '[.workflow_runs[] | .conclusion] | first // "none"')"
          if [ "$conclusion" != "success" ]; then
            echo "CI for ${GITHUB_SHA} is '${conclusion}', not 'success'." >&2
            echo "Publishing 23 write-once crates from an unverified tree is not recoverable." >&2
            exit 1
          fi

      # Runs on every path, the real release included. Packaging is the only
      # check that the manifests cargo *uploads* — not the ones in this
      # repository — are coherent, and skipping it on the one irreversible run
      # is how a workspace ends up half-published.
      - name: Package every crate
        run: ./scripts/release.nu --dry-run

      - name: Publish
        if: ${{ !inputs.dry-run }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: ./scripts/release.nu

      # The notes are the versioned changelog section, already on this commit.
      # Skip if the release exists so a resumed publish does not fail here.
      - name: GitHub Release
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ver="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "pdfrum"))')"
          if gh release view "v${ver}" >/dev/null 2>&1; then
            echo "GitHub Release v${ver} already exists"
            exit 0
          fi
          ./scripts/prepare-release.nu --notes "${ver}" > /tmp/release-notes.md
          gh release create "v${ver}" --title "pdfrum ${ver}" --notes-file /tmp/release-notes.md
