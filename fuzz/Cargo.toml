# pdfrum fuzz ring — a SEPARATE workspace, deliberately not a member of the
# root one. DEPS.md's Pure-Rust guarantee is that no published crate's
# dependency tree compiles C or C++; `libfuzzer-sys` links LLVM's C++
# libFuzzer runtime. Severing this package from the root workspace is what
# keeps `cargo tree --workspace` in scripts/ci.nu clean — the guarantee then
# holds by construction rather than by anyone remembering.
#
# The empty `[workspace]` table below is what does the severing: without it
# cargo walks up to `../Cargo.toml` and adopts this package as a member,
# putting libfuzzer-sys straight into the tree that check inspects. Do not
# delete it, and do not add `fuzz` to the root manifest's `members`.
[workspace]

[package]
name = "pdfrum-fuzz"
version = "0.0.0"
edition = "2024"
# Belt-and-braces on top of the workspace split: this package must never
# reach a registry, whatever anyone runs at the repo root.
publish = false
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

pdfrum-common = { path = "../crates/pdfrum-common" }
pdfrum-object = { path = "../crates/pdfrum-object" }
pdfrum-crypt = { path = "../crates/pdfrum-crypt" }
pdfrum-filters = { path = "../crates/pdfrum-filters", features = ["ccitt"] }
pdfrum-cmap = { path = "../crates/pdfrum-cmap" }
pdfrum-parser = { path = "../crates/pdfrum-parser" }
pdfrum-page = { path = "../crates/pdfrum-page", features = ["jpx", "jbig2", "ccitt"] }
pdfrum-text = { path = "../crates/pdfrum-text" }
pdfrum-edit = { path = "../crates/pdfrum-edit" }

# The root workspace forbids `unsafe` and denies panics. This workspace does
# not inherit those lints (it is a separate workspace by construction), but
# the targets are still written without `unsafe`: libfuzzer-sys's
# `fuzz_target!` hands us a safe `&[u8]`, so nothing here needs it. Panics
# are the *point* here — a panic in a library crate is the bug we are hunting.
[lints.rust]
unsafe_code = "forbid"

[profile.release]
debug = 1
# Overflow checks on: a wrapping arithmetic bug on untrusted sizes is exactly
# the class of bug STYLE.md §3 says fuzzers must enforce.
overflow-checks = true

# cargo-fuzz builds these in release; each gets its own binary.

[[bin]]
name = "object_decode_text"
path = "fuzz_targets/object_decode_text.rs"
test = false
doc = false
bench = false

