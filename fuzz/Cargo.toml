# Own workspace: libfuzzer-sys links C++. The empty [workspace] stops cargo
# walking up to the root; do not add `fuzz` to root `members`.
[workspace]

[package]
name = "pdfrum-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

pdfrum-common = { path = "../crates/pdfrum-common" }
pdfrum-object = { path = "../crates/pdfrum-object" }
pdfrum-crypt = { path = "../crates/pdfrum-crypt" }
pdfrum-filters = { path = "../crates/pdfrum-filters", features = ["ccitt"] }
pdfrum-cmap = { path = "../crates/pdfrum-cmap" }
pdfrum-parser = { path = "../crates/pdfrum-parser" }
pdfrum-page = { path = "../crates/pdfrum-page", features = ["jpx", "jbig2", "ccitt"] }
pdfrum-text = { path = "../crates/pdfrum-text" }
pdfrum-edit = { path = "../crates/pdfrum-edit" }

# Panics are the bug. libfuzzer-sys's fuzz_target! hands a safe `&[u8]`.
[lints.rust]
unsafe_code = "forbid"

[profile.release]
debug = 1
# Wrapping arithmetic on untrusted sizes is the class of bug.
overflow-checks = true

[[bin]]
name = "object_decode_text"
path = "fuzz_targets/object_decode_text.rs"
test = false
doc = false
bench = false

