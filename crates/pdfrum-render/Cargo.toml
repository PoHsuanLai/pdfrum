[package]
name = "pdfrum-render"
description = "Rendering engine and the RenderDevice/RasterBackend seam"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["pdf", "render", "rasterize", "graphics"]
categories = ["graphics", "rendering", "multimedia::images"]

[lints]
workspace = true

# `walk-profile` turns on `walkprofile`'s thread-local accumulator: per-phase
# timers and per-site allocation counters inside the walk, which is how
# docs/status/M12b-P2.md separates allocation churn from colour conversion from
# interpretation on a machine where `perf_event_paranoid > 1` forbids a
# sampler. Off by default and off in every published build; with it off the
# whole module compiles to empty inline functions. See its docs for why the
# accumulator is a thread-local and not a threaded `&mut`.
[features]
default = []
walk-profile = []

[dependencies]
pdfrum-common.workspace = true
pdfrum-object.workspace = true
pdfrum-font.workspace = true
pdfrum-page.workspace = true
kurbo.workspace = true
peniko.workspace = true
smallvec.workspace = true
thiserror.workspace = true

[dev-dependencies]
pdfrum-raster-tinyskia.workspace = true
pdfrum-raster-vello-cpu.workspace = true
# The bench's third backend. It left the facade's normal tree on 2026-09-02
# when `Page::render_on` took the backend as an argument, so the bench names it
# directly like any other caller.
pdfrum-raster-agg.workspace = true
pdfrum-parser.workspace = true

# M12 benches. This crate owns the six render groups: three backends x cold and warm,
# over the shared corpus in `benches/corpus`. See `benches/render.rs` for what
# it measures and `docs/status/M12.md` §1.9 for why each crate owns its own.
#
# `pdfrum` is a dev-dependency and a *cycle* — the facade depends on this crate.
# Cargo permits that for dev-dependencies and it appears in no published normal
# tree. It is here rather than an entry at this crate's own seam because a
# benchmark's number has to describe the same work as the oracle column it is
# compared against, and `pdfium_test` renders a document rather than calling one
# layer of one.
pdfrum.workspace = true
pdfrum-corpus.workspace = true
criterion.workspace = true

[[bench]]
name = "render"
harness = false
