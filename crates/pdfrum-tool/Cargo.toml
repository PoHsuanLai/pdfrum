[package]
name = "pdfrum-tool"
description = "CLI mirroring the pdfium_test oracle's flags and output formats"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["pdf", "cli", "render", "pdfium"]
categories = ["command-line-utilities", "graphics", "text-processing"]

[lints]
workspace = true

[features]
# M15's JavaScript transcript flag. Default-off, and it must stay that way:
# `scripts/check-no-boa.nu` asserts that no workspace member's DEFAULT
# features reach `boa_engine`, and this crate is the second thing it checks
# by name because the CLI is what a headless or CI build actually runs.
javascript = ["dep:pdfrum-form", "pdfrum-form/javascript", "pdfrum/javascript"]

[dependencies]
pdfrum-common.workspace = true
pdfrum-doc.workspace = true
pdfrum-filters.workspace = true
pdfrum-font.workspace = true
pdfrum-object.workspace = true
pdfrum-page.workspace = true
pdfrum-edit.workspace = true
pdfrum-parser.workspace = true
# The facade, for `--send-events`: `pdfrum::FormSession` is the event surface
# the bridge in `dispatch.rs` drives, and driving the facade rather than
# `pdfrum-form` directly is what makes the tool exercise the API a consumer
# would use.
pdfrum.workspace = true
# Only for `--js-transcript`, behind the `script` feature: the transcript is
# `pdfrum_form::script::ScriptCascade`'s, and the facade does not re-export it
# (it cannot — the facade's default features must not reach an engine).
pdfrum-form = { workspace = true, optional = true }
pdfrum-raster-agg.workspace = true
pdfrum-raster-tinyskia.workspace = true
pdfrum-raster-vello-cpu.workspace = true
pdfrum-render.workspace = true
pdfrum-text.workspace = true
kurbo.workspace = true
peniko.workspace = true

# Tool ring only. The oracle's command
# line is hand-parsed rather than declared with clap: `pdfium_test` accepts
# `--pages=3-5` with `std::stringstream` semantics and rejects unknown flags
# with one specific message on stderr, and Tier A compares that behaviour.
anyhow.workspace = true
md-5.workspace = true
png.workspace = true
thiserror.workspace = true
