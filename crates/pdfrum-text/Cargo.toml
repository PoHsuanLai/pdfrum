[package]
name = "pdfrum-text"
description = "Text extraction: reading order, search, link detection"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["pdf", "text", "extraction", "search"]
categories = ["text-processing", "parser-implementations"]
# The generated `unicode.bin` is committed and shipped — `src/unicode.rs`
# `include_bytes!`s it, so a build without it does not compile. The ICU
# property dump it was generated *from* is the build script's input, not the
# library's, and stays out of the package (see `tables/PROVENANCE.md`).
# `tests/files/hello.pdf` is a doctest fixture: the crate-root and query
# examples `include_bytes!` it, so a build from the package without it fails
# to compile the documentation tests.
include = [
    "src/**",
    "tests/files/**",
    "tables/unicode.bin",
    "tables/unicode.manifest.json",
    "tables/PROVENANCE.md",
    "build.rs",
    "README*",
    "LICENSE*",
]

[lints]
workspace = true

[dependencies]
pdfrum-common.workspace = true
pdfrum-object.workspace = true
pdfrum-font.workspace = true
pdfrum-page.workspace = true
kurbo.workspace = true
smallvec.workspace = true
thiserror.workspace = true

[dev-dependencies]
pdfrum-filters.workspace = true
pdfrum-parser.workspace = true

# M12 benches. This crate owns the `text` group: every page's text extracted,
# over the shared corpus in `benches/corpus`. See `benches/text.rs` for what
# it measures and the internal working notes for why each crate owns its own.
#
# `pdfrum` is a dev-dependency and a *cycle* — the facade depends on this crate.
# Cargo permits that for dev-dependencies and it appears in no published normal
# tree. It is here rather than an entry at this crate's own seam because a
# benchmark's number has to describe the same work as the oracle column it is
# compared against, and `pdfium_test` renders a document rather than calling one
# layer of one.
pdfrum.workspace = true
pdfrum-corpus.workspace = true
criterion.workspace = true

[[bench]]
name = "text"
harness = false
