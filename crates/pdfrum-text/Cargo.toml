[package]
name = "pdfrum-text"
description = "Text extraction: reading order, search, link detection"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["pdf", "text", "extraction", "search"]
categories = ["text-processing", "parser-implementations"]
# The generated `unicode.bin` is committed and shipped — `src/unicode.rs`
# `include_bytes!`s it, so a build without it does not compile. The ICU
# property dump it was generated *from* is the build script's input, not the
# library's, and stays out of the package (see `tables/PROVENANCE.md`).
# `tests/files/hello.pdf` is a doctest fixture: the crate-root and query
# examples `include_bytes!` it, so a build from the package without it fails
# to compile the documentation tests.
include = [
    "src/**",
    "tests/files/**",
    "tables/unicode.bin",
    "tables/unicode.manifest.json",
    "tables/PROVENANCE.md",
    "build.rs",
    "README*",
    "LICENSE*",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
pdfrum-common.workspace = true
pdfrum-object.workspace = true
pdfrum-font.workspace = true
pdfrum-page.workspace = true
kurbo.workspace = true
smallvec.workspace = true
thiserror.workspace = true

[dev-dependencies]
pdfrum-filters.workspace = true
pdfrum-parser.workspace = true

# `text` group over `benches/corpus`. `pdfrum` is a permitted dev-dependency cycle.
pdfrum = { path = "../pdfrum" }
pdfrum-corpus.workspace = true
criterion.workspace = true

[[bench]]
name = "text"
harness = false
