[package]
name = "pdfrum-page"
description = "Content-stream interpreter, graphics state, colorspaces, shadings"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["pdf", "content", "colorspace", "shading"]
categories = ["graphics", "parser-implementations", "multimedia::images"]

[lints]
workspace = true

[dependencies]
pdfrum-common.workspace = true
pdfrum-object.workspace = true
pdfrum-filters.workspace = true
pdfrum-font.workspace = true
kurbo.workspace = true
smallvec.workspace = true
thiserror.workspace = true
moxcms.workspace = true
zune-jpeg.workspace = true
hayro-jpeg2000.workspace = true
hayro-jbig2.workspace = true

[dev-dependencies]
pdfrum-parser.workspace = true

# M12 benches. This crate owns the `build` group: the content-stream walk and the page-object list,
# over the shared corpus in `benches/corpus`. See `benches/build.rs` for what
# it measures and `docs/status/M12.md` §1.9 for why each crate owns its own.
#
# `pdfrum` is a dev-dependency and a *cycle* — the facade depends on this crate.
# Cargo permits that for dev-dependencies and it appears in no published normal
# tree. It is here rather than an entry at this crate's own seam because a
# benchmark's number has to describe the same work as the oracle column it is
# compared against, and `pdfium_test` renders a document rather than calling one
# layer of one.
pdfrum.workspace = true
pdfrum-corpus.workspace = true
criterion.workspace = true

[[bench]]
name = "build"
harness = false
