[package]
name = "pdfrum-page"
description = "Content-stream interpreter, graphics state, colorspaces, shadings"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["pdf", "content", "colorspace", "shading"]
categories = ["graphics", "parser-implementations", "multimedia::images"]

# docs.rs renders the full API, including every optional-feature type.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

# The whole-render instrument's thread-local accumulator, in
# `src/renderprofile.rs`. **Off by default and it must stay that way**: cargo
# unifies features across a workspace build, so a default-on flag here would
# put `Instant::now()` pairs inside every criterion group in the workspace and
# make the committed numbers measure the instrument.
#
# The name is `pdfrum-render`'s, deliberately. The two accumulators answer one
# question at two altitudes — this one splits the render around the walk, that
# one splits the walk — and a reader who wants either wants both, so
# `pdfrum-render/profiling` forwards to this and `scripts/profile.nu --walk`
# turns on one flag. The record lives here rather than beside `walkprofile`
# because the stages cross three crates and this is the lowest of the three.
[features]
default = []
# The specialised image codecs, each behind its own feature: JPEG 2000,
# JBIG2, and CCITT fax (which lives in `pdfrum-filters`). Flate and JPEG
# are always present. A stream in a codec this build left out decodes to a
# recorded failure, and the rest of the page still draws.
jpeg2000 = ["dep:hayro-jpeg2000"]
jbig2 = ["dep:hayro-jbig2"]
ccitt = ["pdfrum-filters/ccitt"]
profiling = []

[dependencies]
pdfrum-common.workspace = true
pdfrum-object.workspace = true
pdfrum-filters.workspace = true
pdfrum-font.workspace = true
kurbo.workspace = true
smallvec.workspace = true
thiserror.workspace = true
moxcms.workspace = true
zune-jpeg.workspace = true
hayro-jpeg2000 = { workspace = true, optional = true }
hayro-jbig2 = { workspace = true, optional = true }

[dev-dependencies]
pdfrum-parser.workspace = true

# `build` group over `benches/corpus`. `pdfrum` is a permitted dev-dependency cycle.
pdfrum = { path = "../pdfrum" }
pdfrum-corpus.workspace = true
criterion.workspace = true

[[bench]]
name = "build"
harness = false
