[package]
name = "pdfrum"
description = "Pure-Rust PDF engine: parse, render, extract text, edit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["pdf", "render", "parse", "text", "graphics"]
categories = ["parser-implementations", "graphics", "text-processing", "multimedia::images"]

# Copied from `[workspace.lints]` rather than `workspace = true`: Cargo
# forbids mixing the inherit flag with extra keys, and WP13 adds one
# clippy lint on this crate only. Keep the two tables in step.
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
# WP13: boolean parameters that mean "which mode" are enums on this crate's
# surface. `struct_excessive_bools` stays allowed on engine option structs
# that mirror oracle flag words (`pdfrum_render::RenderOptions`).
fn_params_excessive_bools = "deny"

[features]
# The document's own JavaScript, actually run — `pdfrum-form`'s `javascript`
# feature, forwarded.
#
# What it brings: `boa_engine` and the ~116 crates behind it, pure Rust and
# zero `-sys` (DEPS.md records the audit). Default-off, because an engine that
# executes untrusted script out of a document is a different security
# proposition from a renderer, and most PDF work does not need it —
# `scripts/check-no-boa.nu` is the mechanical proof, asserting that a default
# `pdfrum` resolves with no `boa_*` crate at all *and* that this feature does
# still reach one, so neither half can pass vacuously.
#
# The facade forwards the flag and owns no engine: `boa_engine` is not a
# dependency of this crate under any feature, and `ScriptCascade` lives in
# `pdfrum-form`.
# One rasterizer by default, so `cargo add pdfrum` renders; none with
# `default-features = false`, for a build that only parses, extracts, reads
# forms or edits. Every backend is a feature named after its rasterizer, and
# the GPU one is never in the default set (DEPS.md, "wgpu").
default = ["vello-cpu", "edit", "forms", "codecs-all", "system-fonts"]
vello-cpu = ["dep:pdfrum-raster-vello-cpu"]
tinyskia = ["dep:pdfrum-raster-tinyskia"]
agg = ["dep:pdfrum-raster-agg"]
vello-gpu = ["dep:pdfrum-raster-vello"]

# The subsystems a reader can leave out: `edit` is saving, editing and the
# font subsetter behind it; `forms` is the widget state machine. JavaScript
# needs widgets to act on, so it implies `forms`.
edit = ["dep:pdfrum-edit"]
forms = ["dep:pdfrum-form"]
javascript = ["forms", "pdfrum-form/javascript"]
# Markdown and layout-preserving text from a page: `pdfrum-markdown`, the
# structure tree where there is one and typography where there is not.
markdown = ["dep:pdfrum-markdown"]

# M25: an SVG document drawn into a page as vectors, through
# `Canvas::draw_svg`. Needs `edit`, because a canvas is a drawing session over
# an editable document.
#
# What it brings: `usvg` with `default-features = false` and the nine crates
# behind it new to this workspace, all pure Rust (DEPS.md records the audit).
# Default-off, because ten crates is a real cost for a caller who never meets
# an SVG — and it is deliberately *separate* from `pdfrum-svg`'s export
# feature, which adds nothing to the tree at all: exporting and ingesting
# share a subject but not a price, and a caller who only exports should pay
# nothing for a parser.
svg-ingest = ["edit", "dep:usvg", "dep:png"]

# The specialised image codecs. Flate and JPEG are always in; these three
# are what a build that will never meet them can leave out.
codecs-all = ["jpx", "jbig2", "ccitt"]

# Substitute a missing font from the host's installed ones; off, the bundled
# base-14 faces alone answer. Never compiled into a WebAssembly build.
system-fonts = ["pdfrum-font/system-fonts"]
jpx = ["pdfrum-page/jpx"]
jbig2 = ["pdfrum-page/jbig2"]
ccitt = ["pdfrum-page/ccitt", "pdfrum-filters/ccitt"]

# The whole-render stage timers, forwarded down to `pdfrum-page` where the
# accumulator lives and across to `pdfrum-doc`, which times the annotation
# pass's five stages. Default-off, and it is not a published capability: the
# flag exists so `pdfrum-bench`'s `profile` binary can measure the pipeline
# `Page::paint` runs, and it adds no public item to this crate.
# `Pixmap::encode_png` and `Pixmap::save_png`, for a caller who wants a file
# without choosing an encoder.
png = ["pdfrum-render/png"]

profiling = ["pdfrum-page/profiling", "pdfrum-doc/profiling"]

[dependencies]
pdfrum-common.workspace = true
pdfrum-object.workspace = true
pdfrum-parser.workspace = true
# `[spec]` 2026-09-02, WP1: the facade names `pdfrum_crypt::Permissions` in
# `Document::permissions`, so it depends on the crate that owns the type
# rather than laundering it through `pdfrum-parser`. No new crate reaches the
# tree — `pdfrum-crypt` is already here transitively, through the parser —
# and DEPS.md's external set is untouched. The edge is what WP1's rule
# requires: the crate that owns the encoding owns the type, and the facade
# forwards it rather than translating it.
pdfrum-crypt.workspace = true
pdfrum-font.workspace = true
pdfrum-page.workspace = true
pdfrum-filters.workspace = true
pdfrum-render.workspace = true
# The rasterizers, every one optional and each behind the feature of its
# name; `vello-cpu` is the default. `Page::render` takes the backend as an
# argument, so the facade compiles with none of them.
pdfrum-raster-vello-cpu = { workspace = true, optional = true }
pdfrum-raster-tinyskia = { workspace = true, optional = true }
pdfrum-raster-agg = { workspace = true, optional = true }
pdfrum-raster-vello = { workspace = true, optional = true }
pdfrum-text.workspace = true
pdfrum-doc.workspace = true
pdfrum-markdown = { workspace = true, optional = true }
pdfrum-form = { workspace = true, optional = true }
pdfrum-edit = { workspace = true, optional = true }
# M25's SVG ingestion, behind `svg-ingest`. `default-features = false` per the
# DEPS.md rule: the defaults are `text`, `system-fonts` and `memmap-fonts`,
# all three of which exist to *shape text* through a second font stack, and
# pdfrum has its own. See DEPS.md for what dropping them drops and what the
# consequence for `<text>` is.
usvg = { workspace = true, optional = true }
# Decoding a PNG an SVG `<image>` carried, so it embeds as PDF image samples
# rather than being dropped. Optional and reached only through `svg-ingest`;
# it is also a dev-dependency below, for the examples that write files.
#
# It shares a name with this crate's existing `png` *feature* — the one
# forwarding `pdfrum-render/png`. That is allowed precisely because every
# reference to the dependency in a feature list is written
# `dep:png`, so the feature never implicitly enables it and the two stay
# independent: `--features png` still turns on only the pixmap encoder.
png = { workspace = true, optional = true }
kurbo.workspace = true
peniko.workspace = true
thiserror.workspace = true


[dev-dependencies]
# The facade spawns no thread and builds no pool; `rayon` is what the
# parallel-render example and the test that pins it use, and nothing a
# `cargo add pdfrum` caller compiles.
rayon.workspace = true
# Encoding a pixmap is not the engine's job — the facade hands out pixels and
# the examples turn them into files (DEPS.md, "Tools & tests only").
png.workspace = true

# The other two CPU rasterizers, as **dev**-dependencies (2026-09-02). They
# left the normal tree when `Page::render_on` took the backend as an argument,
# and they are here because `tests/facade.rs` asserts the property that
# justifies the seam: every backend renders the same page at the same size.
# A dev-dependency is exactly what a caller who names one of them writes, so
# the test is also the worked example.
pdfrum-raster-tinyskia.workspace = true
pdfrum-raster-agg.workspace = true

# The engine, named directly (WP10, 2026-09-02). It is already a normal
# dependency, but an integration test is its own crate and can only `use` what
# the manifest lists for it. `tests/facade.rs` drives
# `pdfrum_render::RenderOptions` with the oracle's own `no_path_smooth` and
# asserts the facade's positive `smooth_paths` renders byte-identically — the
# only way to check that inversion from outside the crate.
pdfrum-render.workspace = true

# The filter chain, for `tests/canvas.rs`. An integration test is its own
# crate, and reading back what the canvas wrote means decoding the stream the
# save flate-compressed on the way out — which is exactly the round trip the
# M23 contract asks to be proved. Already a normal dependency; this adds
# nothing to the tree a caller compiles.
pdfrum-filters.workspace = true
# M25's ingestion round trip (`tests/svg_ingest.rs`): render the fixture SVG
# with a *second* implementation and score our page against it, so ingestion
# has the same kind of correctness story M24's export has. **Dev-only** —
# `resvg` never enters the shipped tree, which `scripts/ci.nu`'s pure-Rust
# check covers. Its SSIM module is shared with `pdfrum-svg`'s round trip
# rather than transcribed a second time, so both report the same metric.
resvg.workspace = true
# An integration test is its own crate and can only `use` what the manifest
# lists for it: `tests/svg_ingest.rs` names `Diagnostics` to render the page
# it ingested into. Already a normal dependency of this crate.
pdfrum-common.workspace = true

