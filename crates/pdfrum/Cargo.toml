[package]
name = "pdfrum"
description = "Pure-Rust PDF engine: parse, render, extract text, edit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["pdf", "render", "parse", "text", "graphics"]
categories = ["parser-implementations", "graphics", "text-processing", "multimedia::images"]

# Copied from `[workspace.lints]` rather than `workspace = true`: Cargo
# forbids mixing the inherit flag with extra keys, and WP13 adds one
# clippy lint on this crate only. Keep the two tables in step.
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
# WP13: boolean parameters that mean "which mode" are enums on this crate's
# surface. `struct_excessive_bools` stays allowed on engine option structs
# that mirror oracle flag words (`pdfrum_render::RenderOptions`).
fn_params_excessive_bools = "deny"

[features]
# The document's own JavaScript, actually run — `pdfrum-form`'s `script`
# feature, forwarded.
#
# What it brings: `boa_engine` and the ~116 crates behind it, pure Rust and
# zero `-sys` (DEPS.md records the audit). Default-off, because an engine that
# executes untrusted script out of a document is a different security
# proposition from a renderer, and most PDF work does not need it —
# `scripts/check-no-boa.nu` is the mechanical proof, asserting that a default
# `pdfrum` resolves with no `boa_*` crate at all *and* that this feature does
# still reach one, so neither half can pass vacuously.
#
# The facade forwards the flag and owns no engine: `boa_engine` is not a
# dependency of this crate under any feature, and `ScriptCascade` lives in
# `pdfrum-form`.
javascript = ["pdfrum-form/javascript"]

# The whole-render stage timers, forwarded down to `pdfrum-page` where the
# accumulator lives and across to `pdfrum-doc`, which times the annotation
# pass's five stages. Default-off, and it is not a published capability: the
# flag exists so `pdfrum-bench`'s `profile` binary can measure the pipeline
# `Page::paint` runs, and it adds no public item to this crate.
profiling = ["pdfrum-page/profiling", "pdfrum-doc/profiling"]

[dependencies]
pdfrum-common.workspace = true
pdfrum-object.workspace = true
pdfrum-parser.workspace = true
# `[spec]` 2026-09-02, WP1: the facade names `pdfrum_crypt::Permissions` in
# `Document::permissions`, so it depends on the crate that owns the type
# rather than laundering it through `pdfrum-parser`. No new crate reaches the
# tree — `pdfrum-crypt` is already here transitively, through the parser —
# and DEPS.md's external set is untouched. The edge is what WP1's rule
# requires: the crate that owns the encoding owns the type, and the facade
# forwards it rather than translating it.
pdfrum-crypt.workspace = true
pdfrum-font.workspace = true
pdfrum-page.workspace = true
pdfrum-filters.workspace = true
pdfrum-render.workspace = true
# The facade's ONE rasterizer (2026-09-02). `tiny-skia` and the AGG-parity
# backend used to be here too, because `render::Backend` named all three in an
# enum — so `cargo add pdfrum` compiled three rasterizers whatever the caller
# used. `Page::render_on` takes the backend as an argument now, so those two
# are the caller's own dependency and this tree carries one.
pdfrum-raster-vello-cpu.workspace = true
pdfrum-text.workspace = true
pdfrum-doc.workspace = true
pdfrum-form.workspace = true
pdfrum-edit.workspace = true
kurbo.workspace = true
peniko.workspace = true
thiserror.workspace = true

# DEPS.md marks `rayon` "lib (facade only)": the engine stays single-threaded
# per page and this is the one crate that owns a *set* of pages, so the
# data-parallel seam is here or nowhere. It is used by the parallel-render
# example and by the tests that pin the `Send + Sync` story; the library
# itself spawns no threads.
rayon.workspace = true

[dev-dependencies]
# Encoding a pixmap is not the engine's job — the facade hands out pixels and
# the examples turn them into files (DEPS.md, "Tools & tests only").
png.workspace = true

# The other two CPU rasterizers, as **dev**-dependencies (2026-09-02). They
# left the normal tree when `Page::render_on` took the backend as an argument,
# and they are here because `tests/facade.rs` asserts the property that
# justifies the seam: every backend renders the same page at the same size.
# A dev-dependency is exactly what a caller who names one of them writes, so
# the test is also the worked example.
pdfrum-raster-tinyskia.workspace = true
pdfrum-raster-agg.workspace = true

# The engine, named directly (WP10, 2026-09-02). It is already a normal
# dependency, but an integration test is its own crate and can only `use` what
# the manifest lists for it. `tests/facade.rs` drives
# `pdfrum_render::RenderOptions` with the oracle's own `no_path_smooth` and
# asserts the facade's positive `smooth_paths` renders byte-identically — the
# only way to check that inversion from outside the crate.
pdfrum-render.workspace = true
