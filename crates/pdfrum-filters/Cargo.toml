[package]
name = "pdfrum-filters"
description = "PDF stream filters: Flate, LZW, RunLength, ASCIIHex/85, CCITT"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["pdf", "flate", "lzw", "ccitt", "decode"]
categories = ["compression", "encoding", "parser-implementations"]

# docs.rs renders the full API, including every optional-feature type.
[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true

[features]
# CCITT Group 3/4 fax decoding, behind its own feature; a stream in it
# decodes to a recorded failure without it.
ccitt = ["dep:hayro-ccitt"]

[dependencies]
pdfrum-common.workspace = true
pdfrum-object.workspace = true

hayro-ccitt = { workspace = true, optional = true }
miniz_oxide.workspace = true
thiserror.workspace = true
weezl.workspace = true
