[package]
name = "pdfrum-font"
description = "PDF font dictionaries, encodings, glyph mapping and outlines"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["pdf", "font", "glyph", "encoding", "opentype"]
categories = ["graphics", "text-processing", "parser-implementations"]
# The Foxit blobs are shipped — the 14 base-14 CFF faces and the two
# Multiple-Master `.pfb` fallbacks below them — because they are the bottom
# of the substitution ladder: a build without them cannot draw an
# unresolvable font at all. See `fontdata/PROVENANCE.md`.
# Extensions are named rather than whole directories: `include` globs read
# the working tree, not git, so a `**` here would ship build residue such as
# `__pycache__` that `.gitignore` keeps out of the repository.
include = [
    "src/**",
    "fontdata/*.cff",
    "fontdata/*.pfb",
    "fontdata/*.md",
    "fontdata/*.py",
    "tests/*.rs",
    "tests/fixtures/*.ttf",
    "tests/fixtures/*.md",
    "tests/fixtures/*.py",
    "README*",
    "LICENSE*",
]

# docs.rs renders the full API, including every optional-feature type.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[features]
default = []
# Scanning the host's installed fonts for a substitute, through `fontdb`.
# Off, only the bundled base-14 faces answer. The dependency is declared per
# target below so a WebAssembly build never carries the filesystem scan or
# `memmap2`, whatever features it asks for.
system-fonts = ["dep:fontdb"]

# `skrifa` draws outlines,
# `read-fonts` reads the tables skrifa does not surface (`cmap` subtable
# platform ids, `GSUB`, `OS/2` code-page ranges) and owns the Adobe Glyph
# List; `fontdb` is a face *enumerator* only — the matching policy is ours.
[dependencies]
pdfrum-common.workspace = true
pdfrum-object.workspace = true
pdfrum-cmap.workspace = true
pdfrum-type1.workspace = true
pdfrum-filters.workspace = true
skrifa.workspace = true
read-fonts = { workspace = true, features = ["agl"] }
smallvec.workspace = true
thiserror.workspace = true

[dev-dependencies]
pdfrum-parser.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The host scan, and fontconfig's font directories where it has them — what
# the crate always used, kept so a substitute resolves the way it did.
fontdb = { workspace = true, optional = true, default-features = false, features = ["fs", "memmap", "fontconfig"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# No filesystem, no memory maps: an enumerator over bytes handed to it.
fontdb = { workspace = true, optional = true, default-features = false }
