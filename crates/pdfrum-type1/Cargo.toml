[package]
name = "pdfrum-type1"
description = "Type 1 font parser: PFA/PFB and charstring interpretation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["type1", "font", "charstring", "cff", "postscript"]
categories = ["parser-implementations", "graphics"]

[lints]
workspace = true

# `read-fonts` is here for the Adobe Glyph List only (the `agl` feature) —
# taking it from `pdfrum-font` would be a dependency cycle. `ps::type1` is
# not used.
[dependencies]
pdfrum-common.workspace = true
read-fonts = { workspace = true, features = ["agl"] }
thiserror.workspace = true

[dev-dependencies]
# The differential oracle: `read_fonts::ps::type1` renders the same fonts at
# their file-default weight vector, which is exactly the case our blend engine
# must reproduce byte-for-byte.
read-fonts = { workspace = true, features = ["agl"] }
