[package]
name = "pdfrum-cli"
description = "The pdfrum command line: inspect, render and extract from PDF files"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["pdf", "cli", "render", "text-extraction"]
categories = ["command-line-utilities", "graphics", "text-processing"]

# docs.rs renders the full API, including every optional-feature type.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[bin]]
name = "pdfrum"
path = "src/main.rs"
# The binary shares its name with the library crate; documenting both writes
# two crates into one `doc/pdfrum/` (cargo#6313). The library's docs are the
# ones that matter, so the binary's are off.
doc = false

[features]
# Off by default, as in the facade: the document's own JavaScript, run by a
# pure-Rust engine (boa). It is about 137 more crates and 12 MB more binary
# (stripped), and it executes script out of untrusted documents — a
# different posture from rendering, which is why a default `pdfrum` has
# neither the `scripts` command nor `forms fill --scripts`.
javascript = ["pdfrum/javascript"]

[lints]
workspace = true

[dependencies]
# The facade only: everything the command line needs is what `cargo add
# pdfrum` gets, and a gap here is a gap there.
pdfrum = { workspace = true, features = ["png", "markdown"] }
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
# PNG decoding for `pages create`; the same crate the tool encodes with.
png.workspace = true
# Terminal: keys, size and screen for `view`, and a silent password prompt.
# Inline pictures (kitty, iTerm2, half-block) are written here in `term.rs`.
crossterm.workspace = true
rpassword.workspace = true
# `hash`: SHA-256 of the file and of the canonical object dump; the same
# crate the crypt ring already carries.
sha2.workspace = true
# `completions` and `manpage`: clap's own generators.
clap_complete.workspace = true
clap_mangen.workspace = true

[dev-dependencies]
serde_json.workspace = true
