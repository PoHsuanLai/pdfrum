[package]
name = "pdfrum-cli"
description = "The pdfrum command line: inspect, render and extract from PDF files"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["pdf", "cli", "render", "text-extraction"]
categories = ["command-line-utilities", "graphics", "text-processing"]

[[bin]]
name = "pdfrum"
path = "src/main.rs"
# The binary shares its name with the library crate; documenting both writes
# two crates into one `doc/pdfrum/` (cargo#6313). The library's docs are the
# ones that matter, so the binary's are off.
doc = false

[lints]
workspace = true

[dependencies]
# The facade only: everything the command line needs is what `cargo add
# pdfrum` gets, and a gap here is a gap there.
pdfrum = { workspace = true, features = ["png", "markdown"] }
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
# PNG decoding for `pages create`; the same crate the tool encodes with.
png.workspace = true
# Terminal: keys, size and screen for `view`, and a silent password prompt.
# Inline pictures (kitty, iTerm2, half-block) are written here in `term.rs`:
# `viuer` would have done it, but its half-block path pulls `ansi_colours`,
# LGPL-3.0, which this tree's licence allowlist refuses.
crossterm = { version = "=0.29.0", default-features = false, features = ["events", "windows"] }
rpassword = "=7.5.4"
# `hash`: SHA-256 of the file and of the canonical object dump; the same
# crate the crypt ring already carries.
sha2.workspace = true
# `completions` and `manpage`: clap's own generators.
clap_complete = "=4.6.9"
clap_mangen = "=0.3.3"

[dev-dependencies]
serde_json.workspace = true
