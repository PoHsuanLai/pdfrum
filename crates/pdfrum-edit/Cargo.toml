[package]
name = "pdfrum-edit"
description = "PDF serializer: full/incremental save, page import, subsetting"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["pdf", "write", "serialize", "subset", "save"]
categories = ["encoding", "parser-implementations", "graphics"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[features]
default = []
# Placing a compiled SVG form; the ingestion itself lives in the facade.
svg-import = ["dep:usvg", "dep:png"]
# Text in an ingested SVG, which needs the caller's font set.
svg-text = ["svg-import", "usvg/text"]

[dependencies]
getrandom.workspace = true
kurbo.workspace = true
peniko.workspace = true
usvg = { workspace = true, optional = true }
png = { workspace = true, optional = true }
pdfrum-common.workspace = true
pdfrum-crypt.workspace = true
pdfrum-doc.workspace = true
pdfrum-object.workspace = true
pdfrum-filters.workspace = true
pdfrum-parser.workspace = true
pdfrum-font.workspace = true
pdfrum-page.workspace = true
sha2.workspace = true
subsetter.workspace = true
thiserror.workspace = true
zeroize.workspace = true

[dev-dependencies]
pdfrum-filters.workspace = true
# Test-only: the page crate's graphics state carries `SmallVec` dash arrays
# and colour components, so building one by hand needs the type.
smallvec.workspace = true

# `save` group over `benches/corpus`. `pdfrum` is a permitted dev-dependency cycle.
pdfrum = { path = "../pdfrum" }
pdfrum-corpus.workspace = true
criterion.workspace = true

[[bench]]
name = "save"
harness = false
