[package]
name = "pdfrum-common"
description = "Shared error/diagnostic types and geometry vocabulary for pdfrum"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["pdf", "diagnostics", "limits"]
categories = ["parser-implementations", "data-structures"]

[lints]
workspace = true

# : this crate owns only Diagnostics/Limits and the kurbo re-export.
# It has no fallible operation, hence no `Error` enum and no `thiserror`: the
# one error value it defines, `LimitExceeded`, is produced by the crates that
# hit a limit and carries a hand-written `Display`.
[dependencies]
kurbo.workspace = true
