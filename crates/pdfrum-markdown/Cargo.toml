[package]
name = "pdfrum-markdown"
description = "Markdown and layout-preserving text from a PDF page: the structure tree where there is one, typographic heuristics where there is not"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["pdf", "markdown", "text-extraction", "rag"]
categories = ["text-processing", "parser-implementations"]

[lints]
workspace = true

[dependencies]
pdfrum-common.workspace = true
pdfrum-object.workspace = true
pdfrum-page.workspace = true
pdfrum-text.workspace = true
pdfrum-doc.workspace = true
kurbo.workspace = true

[dev-dependencies]
# The two corpus files the paragraph rules were tuned on are read through
# the facade, the way a caller reads them; a dev-dependency on the crate
# that depends on this one is a cycle Cargo permits, as `pdfrum-text` does
# for its benches.
pdfrum.workspace = true
