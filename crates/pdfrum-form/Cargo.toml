[package]
name = "pdfrum-form"
description = "Form interaction: events, focus, the edit control, the commit cascade"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["pdf", "forms", "acroform", "widgets"]
categories = ["parser-implementations", "data-structures"]

# docs.rs renders the full API, including every optional-feature type.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[features]
# The `boa`-backed `Cascade` — a document's own `/AA` scripts, actually run.
#
# Default-off: with it off, `boa_engine` is not in the tree.
javascript = ["dep:boa_engine", "dep:pdfrum-script"]

[dependencies]
pdfrum-common.workspace = true
pdfrum-object.workspace = true
pdfrum-doc.workspace = true
pdfrum-page.workspace = true
pdfrum-font.workspace = true
kurbo.workspace = true
thiserror.workspace = true
# Both optional and both enabled by `javascript` alone. `pdfrum-script` is the
# `AF*` and `util.*` library — pure functions over plain data, no engine —
# which the binding exposes to scripts as globals rather than reimplementing.
boa_engine = { workspace = true, optional = true }
pdfrum-script = { workspace = true, optional = true }

[dev-dependencies]
pdfrum-parser.workspace = true
