# `libpdfrum` — the C ABI over the facade. PLAN.md §M22.2, docs/design/capi.md.
#
# This crate holds no logic: every function is a handle plus one call into
# `pdfrum`. It is the one place in the workspace where `unsafe` is allowed,
# and the rule that bounds it is written in docs/design/capi.md.
[package]
name = "pdfrum-capi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The C ABI for pdfrum: libpdfrum.so, libpdfrum.a and pdfrum.h"
# Nothing `cargo add`s a cdylib. The published surface of this crate is
# `include/pdfrum.h`, which the API-snapshot gate covers instead
# (scripts/capi-header.nu).
publish = false

[lib]
# The Rust crate name, which is NOT the artefact name. It has to differ from
# `pdfrum`: the facade is this crate's dependency, and two lib targets called
# `pdfrum` in one workspace collide twice over — `cargo test --doc` gets two
# `--extern pdfrum` candidates (E0464), and `cargo doc --workspace` would write
# both crates' pages to `doc/pdfrum/`, which cargo refuses rather than
# clobbering. Keeping the docs and the doctests working is worth more than a
# name nothing outside cargo reads.
#
# The **artefacts** are still `libpdfrum.so` and `libpdfrum.a`, which is what
# actually matters: cargo-c takes their name from
# `[package.metadata.capi.library]` below, and the `cdylib`/`staticlib` that
# `cargo build` produces are renamed by ctest/run.sh's consumer — see the
# `output_name` there. A C program links `-lpdfrum` either way.
name = "pdfrum_capi"
crate-type = ["cdylib", "staticlib"]

[dependencies]
# The only dependency, and deliberately the only one: this crate is a
# translation layer and every question it answers is one the facade already
# answers. DEPS.md's external set is untouched.
pdfrum.workspace = true

[features]
default = []
# cargo-c turns this on for its own builds and expects it to exist. It gates
# nothing: `cargo cbuild`/`cargo cinstall` pass `--features capi`, and a
# manifest without the name fails before it starts. Empty on purpose — the C
# ABI is what this crate *is*, not something a feature adds to it.
capi = []
# `pdfrum_page_markdown`, forwarded from the facade's own feature. Off by
# default, as it is there.
markdown = ["pdfrum/markdown"]

[lints.rust]
# The single workspace exception (PLAN.md §M22.2). `unsafe_code = "forbid"` on
# the workspace makes an `#[unsafe(no_mangle)] extern "C"` function
# impossible, so this crate — and only this crate — allows it. The rule that
# replaces the lint is in docs/design/capi.md: unsafe appears only in an
# `extern "C"` boundary function, every one of those carries a `# Safety`
# section, and nothing unsafe reaches below the facade.
unsafe_code = "allow"
missing_docs = "warn"
# The exported types are named as C sees them — `pdfrum_document`, not
# `PdfrumDocument`. cbindgen renames on the way out either way, but a Rust
# name that matches the header is what makes a `# Safety` section and a header
# comment read as being about the same thing, and it is what keeps a grep for
# `pdfrum_page` finding both sides of the boundary.
non_camel_case_types = "allow"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

# cargo-c: `cargo cinstall` lays down libpdfrum.{so,a}, include/pdfrum.h and a
# pkg-config file named `pdfrum`. The header is the committed one, generated by
# the same cbindgen.toml.
[package.metadata.capi]
min_version = "0.10.0"

[package.metadata.capi.header]
name = "pdfrum"
subdirectory = false

[package.metadata.capi.pkg_config]
name = "pdfrum"
filename = "pdfrum"
description = "A pure-Rust PDF engine: parse, render, extract, fill and save"

[package.metadata.capi.library]
name = "pdfrum"
