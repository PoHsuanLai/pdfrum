# cbindgen — `include/pdfrum.h` is generated from the Rust signatures so the
# header cannot drift from the library. scripts/capi-header.nu regenerates it
# into a temp file and diffs; a difference fails CI.
#
# Determinism is the whole point of the settings below: sorted output, no
# timestamp, no include guard derived from a path.
language = "C"
header = """/* libpdfrum — the C ABI for the pdfrum PDF engine.
 *
 * GENERATED by cbindgen from crates/pdfrum-capi/src/. Do not edit by hand:
 * `scripts/capi-header.nu check` regenerates this file and fails CI on a
 * difference. Regenerate deliberately with `scripts/capi-header.nu update`.
 *
 * The contracts this header states — who owns which pointer, who frees what,
 * which handle may cross a thread — are written out per function below and in
 * docs/design/capi.md.
 *
 * NOT in this library: the facade's `javascript` feature. A document's own
 * scripts are never executed by libpdfrum, under any build — running untrusted
 * script out of a document is a different security proposition from rendering
 * one, and a C caller who wants it links the Rust facade with that feature
 * instead. There is no `pdfrum_script_*` and there is no runtime switch.
 *
 * Licensed under MIT OR Apache-2.0. */"""
include_version = false
pragma_once = true
no_includes = false
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
cpp_compat = true
documentation = true
documentation_style = "c99"
line_length = 80
tab_width = 4
style = "type"

[export]
# No `prefix`: the Rust types are already named as C sees them
# (`pdfrum_document`, not `Document`), so a prefix here would double it.
# Sorted, so the file is a function of the source and not of cbindgen's walk
# order.
item_types = ["enums", "structs", "opaque", "typedefs", "constants", "functions"]

[enum]
prefix_with_name = true
rename_variants = "ScreamingSnakeCase"

[defines]
# `pdfrum_page_markdown` exists only in a build with the `markdown` feature.
# The header declares it under this guard so one header serves both builds and
# a caller can `#ifdef` on the same name.
"feature = markdown" = "PDFRUM_MARKDOWN"

[parse]
parse_deps = false

[fn]
sort_by = "Name"
must_use = "PDFRUM_MUST_USE"

[struct]
derive_eq = false
