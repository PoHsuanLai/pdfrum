[package]
name = "pdfrum-doc"
description = "Bookmarks, annotations, AcroForm data model, structure tree"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["pdf", "annotations", "forms", "bookmarks"]
categories = ["parser-implementations", "data-structures"]

[lints]
workspace = true

# The annotation and appearance pass's own stage timers, forwarded to
# `pdfrum-page` where the accumulator lives. Default-off for the reason its
# does: cargo unifies features across a workspace build, so a default-on flag
# here would put `Instant::now()` pairs inside every criterion group in the
# workspace. This crate needs a flag of its own rather than reading
# `pdfrum-page`'s because `#[cfg(feature = ...)]` names *this* crate's
# features and nothing else's.
[features]
default = []
profiling = ["pdfrum-page/profiling"]

[dependencies]
pdfrum-common.workspace = true
pdfrum-object.workspace = true
pdfrum-font.workspace = true
pdfrum-filters.workspace = true
pdfrum-page.workspace = true
kurbo.workspace = true
ryu.workspace = true
thiserror.workspace = true
unicode-bidi.workspace = true

[dev-dependencies]

pdfrum-parser.workspace = true
